services:
  website:
    build: .
    image: crpi-gw9oqim33coyxw0c.cn-hangzhou.personal.cr.aliyuncs.com/coosso/website:latest
    container_name: website
    restart: always
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
